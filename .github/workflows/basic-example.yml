name: Basic Example
on: [push, pull_request]

permissions:
  contents: read

jobs:
  armv7_job:
    # The host should always be linux
    runs-on: ubuntu-22.04
    name: Build on ubuntu-22.04 armv7
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
      - uses: uraimo/run-on-arch-action@460cb8e6d9f726a588fc9b5e681c8a6cab09ae41 # master
        name: Run commands
        id: runcmd
        with:
          arch: armv7
          distro: ubuntu22.04

          # Not required, but speeds up builds
          #githubToken: ${{ github.token }}

          run: |
            uname -a
            echo ::set-output name=uname::$(uname -a)

      - name: Get the output
        env:
          UNAME_OUTPUT: ${{ steps.runcmd.outputs.uname }}
        run: |
          echo "The uname output was $UNAME_OUTPUT"
