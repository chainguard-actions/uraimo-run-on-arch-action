name: Test setup step and docker volume args
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run with setup and volume mapping
        id: action
        uses: .
        continue-on-error: true
        with:
          arch: aarch64
          distro: ubuntu20.04
          setup: |
            mkdir -p /tmp/test-artifacts
            echo "host-created-file" > /tmp/test-artifacts/input.txt
          dockerRunArgs: |
            --volume /tmp/test-artifacts:/artifacts
          run: |
            echo "Reading file from mounted volume:"
            cat /artifacts/input.txt
            if [ "$(cat /artifacts/input.txt)" != "host-created-file" ]; then
              echo "FAIL: volume mount did not work correctly"
              exit 1
            fi
            echo "PASS: volume mount works correctly"
            echo "container-output" > /artifacts/output.txt
      - name: Assert action ran or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "Checking output from container via volume:"
            cat /tmp/test-artifacts/output.txt
            if [ "$(cat /tmp/test-artifacts/output.txt)" != "container-output" ]; then
              echo "FAIL: container did not write output file correctly"
              exit 1
            fi
            echo "PASS: container wrote output file correctly"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (Docker/QEMU not available in this environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
