name: Test alpine armv6 with default sh shell
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          arch: armv6
          distro: alpine_latest
          run: |
            uname -m
            echo "arch_output=$(uname -m)" >> $GITHUB_OUTPUT
      - name: Assert armv6 architecture on alpine or graceful failure
        env:
          ARCH: ${{ steps.action.outputs.arch_output }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "arch: $ARCH"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$ARCH" != "armv6l" ]; then
              echo "FAIL: expected armv6l but got '$ARCH'"
              exit 1
            fi
            echo "PASS: architecture is armv6l on alpine"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (QEMU/Docker infrastructure not available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
