name: Test basic aarch64 usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          arch: aarch64
          distro: ubuntu20.04
          run: |
            uname -m
            echo "Running on aarch64"

      - name: Assert aarch64 action ran or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully on aarch64/ubuntu20.04"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (QEMU/Docker multi-arch not available in this environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
