name: Test environment variable propagation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          arch: aarch64
          distro: ubuntu20.04
          env: |
            MY_TEST_VAR: hello_from_host
            ANOTHER_VAR: world
          run: |
            echo "MY_TEST_VAR=$MY_TEST_VAR"
            echo "ANOTHER_VAR=$ANOTHER_VAR"
            echo "env_output=${MY_TEST_VAR}_${ANOTHER_VAR}" >> $GITHUB_OUTPUT
      - name: Assert env vars were propagated or graceful failure
        env:
          ENV_OUTPUT: ${{ steps.action.outputs.env_output }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "env_output: $ENV_OUTPUT"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$ENV_OUTPUT" != "hello_from_host_world" ]; then
              echo "FAIL: expected 'hello_from_host_world' but got '$ENV_OUTPUT'"
              exit 1
            fi
            echo "PASS: environment variables were propagated correctly"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (QEMU/Docker infrastructure not available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
