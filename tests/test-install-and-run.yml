name: Test install and run on s390x
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          arch: s390x
          distro: ubuntu20.04
          install: |
            apt-get update -q -y
            apt-get install -q -y python3
          run: |
            uname -m
            python3 --version
            python3 -c "print('Hello from s390x!')"

      - name: Assert install and run succeeded or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: install and run test completed successfully on s390x"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (QEMU/Docker multi-arch not available in this environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
