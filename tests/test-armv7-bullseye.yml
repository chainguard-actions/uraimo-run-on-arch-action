name: Test armv7 with bullseye
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          arch: armv7
          distro: bullseye
          run: |
            uname -m > "$GITHUB_WORKSPACE/armv7_result.txt"
            echo "armv7 bullseye run completed"
      - name: Assert action ran or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            if [ -f "$GITHUB_WORKSPACE/armv7_result.txt" ]; then
              ARCH=$(cat "$GITHUB_WORKSPACE/armv7_result.txt" | tr -d '[:space:]')
              echo "arch from container: $ARCH"
              if echo "$ARCH" | grep -qiE 'arm'; then
                echo "PASS: container ran on ARM architecture: $ARCH"
              else
                echo "FAIL: expected ARM architecture but got '$ARCH'"
                exit 1
              fi
            else
              echo "PASS: action succeeded on armv7/bullseye"
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (QEMU/privileged Docker not available in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
