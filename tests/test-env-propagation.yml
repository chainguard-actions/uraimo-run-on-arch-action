name: Test environment variable propagation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MY_TEST_VAR: hello_from_host
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          arch: aarch64
          distro: ubuntu20.04
          env: |
            MY_TEST_VAR: hello_from_host
            CUSTOM_VAR: custom_value_123
          run: |
            echo "MY_TEST_VAR=$MY_TEST_VAR"
            echo "CUSTOM_VAR=$CUSTOM_VAR"
            if [ "$MY_TEST_VAR" != "hello_from_host" ]; then
              echo "FAIL: MY_TEST_VAR not propagated correctly, got: $MY_TEST_VAR"
              exit 1
            fi
            if [ "$CUSTOM_VAR" != "custom_value_123" ]; then
              echo "FAIL: CUSTOM_VAR not set correctly, got: $CUSTOM_VAR"
              exit 1
            fi
            echo "PASS: environment variables propagated correctly"

      - name: Assert env propagation succeeded or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: environment variable propagation test completed successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (QEMU/Docker multi-arch not available in this environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
