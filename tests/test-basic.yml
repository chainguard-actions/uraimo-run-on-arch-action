name: Test basic aarch64 usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          arch: aarch64
          distro: ubuntu20.04
          run: |
            uname -m > "$GITHUB_WORKSPACE/arch_result.txt"
            echo "aarch64 run completed"
      - name: Assert action ran or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            # Validate that the container actually ran and wrote output
            if [ -f "$GITHUB_WORKSPACE/arch_result.txt" ]; then
              ARCH=$(cat "$GITHUB_WORKSPACE/arch_result.txt" | tr -d '[:space:]')
              echo "arch from container: $ARCH"
              if [ "$ARCH" != "aarch64" ]; then
                echo "FAIL: expected aarch64 but got '$ARCH'"
                exit 1
              fi
              echo "PASS: container ran on aarch64"
            else
              echo "PASS: action succeeded (container ran)"
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (QEMU/privileged Docker not available in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
